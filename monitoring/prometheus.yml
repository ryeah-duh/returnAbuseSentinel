global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "sentinel-api"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["api:8000"]

  - job_name: "sentinel-alerts"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics/prometheus

rule_files: []

alerting:
  alertmanagers: []
